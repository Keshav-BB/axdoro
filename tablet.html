<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AXDORO // Tablet View (iPad Air • 768px)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090b;
      --card-bg: #141417;
      --border: #27272a;
      --accent: #f59e0b;
      --text: #f4f4f5;
      --muted: #a1a1aa;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at top, #18181b 0%, #09090b 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 12px 32px;
    }
    header {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 20px;
      background: rgba(24, 24, 27, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 16px;
      margin-bottom: 24px;
    }
    .brand-title {
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      background: #000;
      color: var(--accent);
      padding: 4px 8px;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      border: 1px solid #3f3f46;
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .nav-btn {
      text-decoration: none;
      background: #27272a;
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid #3f3f46;
      transition: all 0.2s;
    }
    .nav-btn:hover {
      background: #3f3f46;
      border-color: var(--accent);
    }
    .nav-btn.primary {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }
    .tablet-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 100%;
      overflow-x: auto;
    }
    .device-info {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }
    .tablet-bezel {
      width: 804px;
      height: 980px;
      background: #1c1c22;
      border-radius: 38px;
      padding: 18px;
      box-shadow:
        0 0 0 3px #2b2b36,
        0 0 0 5px #121216,
        0 25px 60px -12px rgba(0, 0, 0, 0.85),
        0 0 40px rgba(217, 119, 6, 0.15);
      position: relative;
    }
    .camera-dot {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #09090b;
    }
    .screen {
      width: 768px;
      height: 944px;
      background: #faf9f6;
      border-radius: 24px;
      overflow: hidden;
      position: relative;
    }
    iframe {
      width: 768px;
      height: 944px;
      border: none;
      display: block;
      background: #faf9f6;
    }
    .home-bar {
      position: absolute;
      bottom: 6px;
      left: 50%;
      transform: translateX(-50%);
      width: 160px;
      height: 4px;
      background: #18181b;
      border-radius: 3px;
      z-index: 50;
      pointer-events: none;
      opacity: 0.6;
    }
    footer {
      margin-top: 24px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand-title">
      <span class="badge">AXDORO</span>
      <span>Tablet View Simulator</span>
    </div>
    <div class="nav-links">
      <a href="./mobile.html" class="nav-btn">Switch to Mobile View (390px)</a>
      <a href="./showcase.html" class="nav-btn">All-in-One Showcase</a>
      <a href="./index.html" class="nav-btn primary" target="_blank">Open Direct Site ↗</a>
    </div>
  </header>

  <div class="tablet-wrapper">
    <div class="device-info">
      <span class="status-dot"></span>
      <span>iPad Air • 768 × 1024 px (Tablet Breakpoint `md:`)</span>
    </div>
    <div class="tablet-bezel">
      <div class="camera-dot"></div>
      <div class="screen">
        <iframe id="store-frame" src="./index.html"></iframe>
        <div class="home-bar"></div>
      </div>
    </div>
  </div>

  <footer>
    Adaptive 2-column catalog grid, expanded sticky navigation, and high-DPI responsive layout live inside this frame.
  </footer>
</body>
</html>
