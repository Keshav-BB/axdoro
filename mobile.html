<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AXDORO // Mobile View (iPhone 15 Pro • 390px)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090b;
      --card-bg: #141417;
      --border: #27272a;
      --accent: #f59e0b;
      --text: #f4f4f5;
      --muted: #a1a1aa;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at top, #18181b 0%, #09090b 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 12px 32px;
    }
    header {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 20px;
      background: rgba(24, 24, 27, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 16px;
      margin-bottom: 24px;
    }
    .brand-title {
      font-weight: 800;
      font-size: 15px;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      background: #000;
      color: var(--accent);
      padding: 4px 8px;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      border: 1px solid #3f3f46;
    }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .nav-btn {
      text-decoration: none;
      background: #27272a;
      color: var(--text);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid #3f3f46;
      transition: all 0.2s;
    }
    .nav-btn:hover {
      background: #3f3f46;
      border-color: var(--accent);
    }
    .nav-btn.primary {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }
    .phone-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .device-info {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }
    .phone-bezel {
      width: 406px;
      height: 860px;
      background: #1e1e24;
      border-radius: 54px;
      padding: 12px;
      box-shadow:
        0 0 0 4px #2b2b36,
        0 0 0 6px #121216,
        0 25px 60px -12px rgba(0, 0, 0, 0.85),
        0 0 40px rgba(217, 119, 6, 0.15);
      position: relative;
    }
    .screen {
      width: 382px;
      height: 836px;
      background: #faf9f6;
      border-radius: 44px;
      overflow: hidden;
      position: relative;
    }
    .dynamic-island {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 110px;
      height: 28px;
      background: #000;
      border-radius: 20px;
      z-index: 50;
      pointer-events: none;
    }
    .phone-status-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 44px;
      padding: 10px 24px 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 700;
      color: #18181b;
      z-index: 40;
      pointer-events: none;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }
    .status-icons {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
    }
    iframe {
      width: 382px;
      height: 836px;
      border: none;
      display: block;
      background: #faf9f6;
    }
    .home-bar {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 125px;
      height: 4px;
      background: #18181b;
      border-radius: 3px;
      z-index: 50;
      pointer-events: none;
      opacity: 0.6;
    }
    footer {
      margin-top: 24px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand-title">
      <span class="badge">AXDORO</span>
      <span>Mobile View Simulator</span>
    </div>
    <div class="nav-links">
      <a href="./tablet.html" class="nav-btn">Switch to Tablet View (768px)</a>
      <a href="./showcase.html" class="nav-btn">All-in-One Showcase</a>
      <a href="./index.html" class="nav-btn primary" target="_blank">Open Direct Site ↗</a>
    </div>
  </header>

  <div class="phone-wrapper">
    <div class="device-info">
      <span class="status-dot"></span>
      <span>iPhone 15 Pro • 390 × 844 px (Viewport Scale 1:1)</span>
    </div>
    <div class="phone-bezel">
      <div class="screen">
        <div class="dynamic-island"></div>
        <div class="phone-status-bar">
          <span>9:41</span>
          <div class="status-icons">
            <span>5G</span>
            <span>100% 🔋</span>
          </div>
        </div>
        <iframe id="store-frame" src="./index.html"></iframe>
        <div class="home-bar"></div>
      </div>
    </div>
  </div>

  <footer>
    Touch gestures, slide-out cart drawer, and 360° product inspection are fully interactive inside this frame.
  </footer>
</body>
</html>
